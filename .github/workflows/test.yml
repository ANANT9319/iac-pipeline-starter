name: Terraform Preprod CI/CD

on:
  push:
    branches:
      - main
      - feature/iac-pipeline-setup

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:

  # =========================================================
  # 1. GITLEAKS SECRET SCAN
  # =========================================================

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # 2. TERRAFORM PLAN
  # =========================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs: gitleaks

    defaults:
      run:
        working-directory: env/preprod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      # -------------------------------------------------------
      # Azure Login
      # -------------------------------------------------------

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.ARM_CLIENT_ID }}" \
            --password "${{ secrets.ARM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.ARM_TENANT_ID }}"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - name: Check Azure Login
        run: az account show

      # -------------------------------------------------------
      # Terraform Checks
      # -------------------------------------------------------

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false


  # =========================================================
  # 3. AUTOMATIC PULL REQUEST
  # =========================================================

  create-pull-request:
    name: Create / Update Pull Request
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Only run when feature branch is pushed
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/iac-pipeline-setup'

    permissions:
      contents: read
      pull-requests: write

    steps:

      # -------------------------------------------------------
      # Check whether PR already exists
      # -------------------------------------------------------

      - name: Check Existing Pull Request
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          echo "Existing PR number: $PR_NUMBER"

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # Create PR if no PR exists
      # -------------------------------------------------------

      - name: Create Pull Request
        if: steps.check-pr.outputs.PR_NUMBER == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "Terraform Preprod Changes" \
            --body "$(cat <<'EOF'
          ## Terraform Preprod Change

          Automated Pull Request created by GitHub Actions.

          ### Validation

          - Gitleaks Secret Scan: PASSED
          - Terraform Format: PASSED
          - Terraform Init: PASSED
          - Terraform Validate: PASSED
          - Terraform Plan: PASSED

          ### Next Step

          Please review and approve this Pull Request.

          After the PR is merged into `main`, Terraform Apply will run automatically.
          EOF
          )"

      # -------------------------------------------------------
      # PR already exists
      # -------------------------------------------------------

      - name: PR Already Exists
        if: steps.check-pr.outputs.PR_NUMBER != ''
        run: |
          echo "Pull Request #${{ steps.check-pr.outputs.PR_NUMBER }} already exists."
          echo "New commits will automatically appear in the existing Pull Request."


  # =========================================================
  # 4. TERRAFORM APPLY
  # =========================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - terraform-plan

    # -------------------------------------------------------
    # Apply ONLY after push/merge to main
    # -------------------------------------------------------

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: env/preprod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      # -------------------------------------------------------
      # Azure Login
      # -------------------------------------------------------

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.ARM_CLIENT_ID }}" \
            --password "${{ secrets.ARM_CLIENT_SECRET }}" \
            --tenant "${{ secrets.ARM_TENANT_ID }}"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - name: Check Azure Login
        run: az account show

      # -------------------------------------------------------
      # Terraform
      # -------------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan