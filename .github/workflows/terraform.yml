name: Terraform Preprod CI/CD

on:
  push:
    branches:
      - main
      - feature/iac-pipeline-setup

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:

  # =========================================================
  # 1. GITLEAKS SECRET SCAN
  # =========================================================

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # 2. TERRAFORM PLAN
  # =========================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs: gitleaks

    defaults:
      run:
        working-directory: env/preprod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username ${{ secrets.ARM_CLIENT_ID }} \
            --password ${{ secrets.ARM_CLIENT_SECRET }} \
            --tenant ${{ secrets.ARM_TENANT_ID }}

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false


  # =========================================================
  # 3. AUTOMATIC PULL REQUEST
  # =========================================================

  create-pull-request:
    name: Create / Update Pull Request
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Only create/update PR when feature branch is pushed
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/iac-pipeline-setup'

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: feature/iac-pipeline-setup
          title: "Terraform Preprod Changes"
          body: |
            ## Terraform Preprod Change

            Gitleaks scan completed successfully.

            Terraform format, init, validate and plan completed successfully.

            Please review the changes and merge the PR after approval.

          labels: |
            terraform
            automated-pr


  # =========================================================
  # 4. TERRAFORM APPLY
  # =========================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - terraform-plan

    # Apply ONLY after merge/push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: env/preprod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username ${{ secrets.ARM_CLIENT_ID }} \
            --password ${{ secrets.ARM_CLIENT_SECRET }} \
            --tenant ${{ secrets.ARM_TENANT_ID }}

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan