name: Terraform Preprod CI/CD

on:
  push:
    branches:
      - feature/iac-pipeline-setup
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-preprod-plan:
    runs-on: ubuntu-latest
    name: Terraform Plan (Preprod)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username ${{ secrets.ARM_CLIENT_ID }} \
            --password ${{ secrets.ARM_CLIENT_SECRET }} \
            --tenant ${{ secrets.ARM_TENANT_ID }}

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init
        working-directory: env/preprod

      - name: Terraform Validate
        run: terraform validate
        working-directory: env/preprod

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: env/preprod

  terraform-preprod-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Terraform Apply (Preprod)
    environment: preprod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username ${{ secrets.ARM_CLIENT_ID }} \
            --password ${{ secrets.ARM_CLIENT_SECRET }} \
            --tenant ${{ secrets.ARM_TENANT_ID }}

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init
        working-directory: env/preprod

      - name: Terraform Validate
        run: terraform validate
        working-directory: env/preprod

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: env/preprod

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: env/preprod
